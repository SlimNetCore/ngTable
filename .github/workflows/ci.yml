name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - run: npm run build:demo
      - run: npm run theme:check
      - run: npm run worker:check
      - run: npm run schematics:check
      - run: npm run schematics:test
      - run: npm run docs:build

      # Navigateur réel : audit d'accessibilité axe (WCAG 2.2 A/AA) de la démo, clair / sombre, RTL, écran étroit, barre d'actions.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
