name: Documentation

# Publie le site de documentation (généré depuis README.md, CHANGELOG.md et ROADMAP.md) sur GitHub Pages.
# À activer une fois : Réglages du dépôt > Pages > Source : « GitHub Actions ».
on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - ROADMAP.md
      - scripts/build-docs.mjs
      - scripts/docs/**
      - typedoc.json
      - projects/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run docs:build
      # Démo vivante sous /demo/ : le repli 404 renvoie vers l'application pour les routes (/demo/avance...).
      - run: node scripts/build-demo-docs.mjs /ngTable/demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs
      - id: deployment
        uses: actions/deploy-pages@v4