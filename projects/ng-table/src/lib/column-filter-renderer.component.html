@if (type() === 'date') {
  <div [class.active]="isActive()" class="field-shell">
    <input
      (change)="onSingleDateChange($any($event.target).value)"
      [attr.aria-label]="placeholder() || filterByPlaceholder()"
      [value]="singleDate()"
      class="col-filter col-filter--date"
      type="date"
    />
  </div>
} @else if (type() === 'range') {
  <div [class.active]="isActive()" class="field-shell date-range">
    <input
      (change)="onDateRangeChange('from', $any($event.target).value)"
      [attr.aria-label]="filterByPlaceholder() + ' — ' + labels().dateStart"
      [attr.max]="dateRangeBounds().to || null"
      [value]="dateRangeBounds().from"
      class="col-filter col-filter--date"
      type="date"
    />
    <span aria-hidden="true" class="date-range__separator">–</span>
    <input
      (change)="onDateRangeChange('to', $any($event.target).value)"
      [attr.aria-label]="filterByPlaceholder() + ' — ' + labels().dateEnd"
      [attr.min]="dateRangeBounds().from || null"
      [value]="dateRangeBounds().to"
      class="col-filter col-filter--date"
      type="date"
    />
  </div>
} @else if (type() === 'numberRange') {
  <div [class.active]="isActive()" class="number-range">
    <div class="field-shell">
      <input
        (input)="onNumberRangeInput('min', $any($event.target).value)"
        [attr.aria-label]="filterByPlaceholder() + ' — ' + labels().numberMin"
        [placeholder]="labels().numberMin"
        [value]="numberRangeBounds().min"
        class="col-filter"
        inputmode="decimal"
        type="text"
      />
    </div>
    <div class="field-shell">
      <input
        (input)="onNumberRangeInput('max', $any($event.target).value)"
        [attr.aria-label]="filterByPlaceholder() + ' — ' + labels().numberMax"
        [placeholder]="labels().numberMax"
        [value]="numberRangeBounds().max"
        class="col-filter"
        inputmode="decimal"
        type="text"
      />
    </div>
  </div>
} @else {
  @if (isSelectType()) {
    <ng-table-select
      (valueChange)="onSelect($event)"
      [allLabel]="isMultiSelect() ? null : labels().all"
      [ariaLabel]="filterByPlaceholder()"
      [class.active]="isActive()"
      [clearLabel]="labels().clearFilter"
      [emptyLabel]="labels().noData"
      [multiple]="isMultiSelect()"
      [options]="type() === 'boolean' ? booleanOptions() : options()"
      [panelWidth]="280"
      [placeholder]="placeholder() || filterByPlaceholder()"
      [searchLabel]="labels().search"
      [searchable]="true"
      [value]="selectedValues()"
      class="select-filter-field"
    />
  } @else {
    <div [class.active]="isActive()" class="field-shell">
      <input
        (input)="onInput($event)"
        [attr.aria-label]="placeholder() || filterByPlaceholder()"
        [attr.inputmode]="inputMode()"
        [attr.type]="inputType()"
        [placeholder]="placeholder() || filterByPlaceholder()"
        [value]="value()"
        class="col-filter"
      />

      @if (showsTrailingIcon()) {
        <ng-table-icon aria-hidden="true" class="field-icon" [name]="trailingIcon()"/>
      }
    </div>
  }
}

@if (isActive()) {
  <button
    (click)="clear.emit()"
    [attr.aria-label]="labels().clearFilter"
    class="clear-filter"
    ngt-icon-button
    type="button"
  >
    <ng-table-icon aria-hidden="true" name="close"/>
  </button>
}
