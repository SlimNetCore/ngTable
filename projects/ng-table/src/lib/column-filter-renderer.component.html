@if (type() === 'date') {
  <mat-form-field appearance="outline" class="date-field">
    <mat-label>{{ filterByPlaceholder() }}</mat-label>
    <input
      (dateChange)="onSingleDateChange($event.value)"
      [matDatepicker]="singlePicker"
      [placeholder]="placeholder() || filterByPlaceholder()"
      [value]="draftDate()"
      matInput
    />
    <mat-datepicker-toggle [for]="singlePicker" matIconSuffix></mat-datepicker-toggle>
    <mat-datepicker #singlePicker/>
  </mat-form-field>
} @else if (type() === 'range') {
  <mat-form-field appearance="outline" class="date-range-field">
    <mat-label>{{ filterByPlaceholder() }}</mat-label>
    <mat-date-range-input [rangePicker]="picker" [separator]="'–'">
      <input
        (dateChange)="onDraftDateRangeChange('from', $event.value)"
        (dateInput)="onDraftDateRangeChange('from', $event.value)"
        (keydown.enter)="applyDateRange()"
        [placeholder]="labels().dateStart"
        [value]="draftDateRange().from"
        matStartDate
      />
      <input
        (dateChange)="onDraftDateRangeChange('to', $event.value)"
        (dateInput)="onDraftDateRangeChange('to', $event.value)"
        (keydown.enter)="applyDateRange()"
        [placeholder]="labels().dateEnd"
        [value]="draftDateRange().to"
        matEndDate
      />
    </mat-date-range-input>
    <mat-datepicker-toggle [for]="picker" matIconSuffix></mat-datepicker-toggle>
    <mat-date-range-picker #picker (opened)="syncDraftDateRange()">
      <mat-date-range-picker-actions>
        <button (click)="cancelDateRange()" ngt-button matDateRangePickerCancel type="button">
          {{ labels().cancel }}
        </button>
        <button
          (click)="applyDateRange()"
          color="primary"
          ngt-flat-button
          matDateRangePickerApply
          type="button"
        >
          {{ labels().ok }}
        </button>
      </mat-date-range-picker-actions>
    </mat-date-range-picker>
  </mat-form-field>
} @else if (type() === 'numberRange') {
  <div [class.active]="isActive()" class="number-range">
    <div class="field-shell">
      <input
        (input)="onNumberRangeInput('min', $any($event.target).value)"
        [attr.aria-label]="filterByPlaceholder() + ' — ' + labels().numberMin"
        [placeholder]="labels().numberMin"
        [value]="numberRangeBounds().min"
        class="col-filter"
        inputmode="decimal"
        type="text"
      />
    </div>
    <div class="field-shell">
      <input
        (input)="onNumberRangeInput('max', $any($event.target).value)"
        [attr.aria-label]="filterByPlaceholder() + ' — ' + labels().numberMax"
        [placeholder]="labels().numberMax"
        [value]="numberRangeBounds().max"
        class="col-filter"
        inputmode="decimal"
        type="text"
      />
    </div>
  </div>
} @else {
  @if (isSelectType()) {
    <ng-table-select
      (valueChange)="onSelect($event)"
      [allLabel]="isMultiSelect() ? null : labels().all"
      [ariaLabel]="filterByPlaceholder()"
      [class.active]="isActive()"
      [clearLabel]="labels().clearFilter"
      [emptyLabel]="labels().noData"
      [multiple]="isMultiSelect()"
      [options]="type() === 'boolean' ? booleanOptions() : options()"
      [panelWidth]="280"
      [placeholder]="placeholder() || filterByPlaceholder()"
      [searchLabel]="labels().search"
      [searchable]="true"
      [value]="selectedValues()"
      class="select-filter-field"
    />
  } @else {
    <div [class.active]="isActive()" class="field-shell">
      <input
        (input)="onInput($event)"
        [attr.aria-label]="placeholder() || filterByPlaceholder()"
        [attr.inputmode]="inputMode()"
        [attr.type]="inputType()"
        [placeholder]="placeholder() || filterByPlaceholder()"
        [value]="value()"
        class="col-filter"
      />

      @if (showsTrailingIcon()) {
        <ng-table-icon aria-hidden="true" class="field-icon" [name]="trailingIcon()"/>
      }
    </div>
  }
}

@if (isActive()) {
  <button
    (click)="clear.emit()"
    [attr.aria-label]="labels().clearFilter"
    class="clear-filter"
    ngt-icon-button
    type="button"
  >
    <ng-table-icon aria-hidden="true" name="close"/>
  </button>
}
