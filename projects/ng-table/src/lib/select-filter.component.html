<mat-form-field appearance="outline" class="select-filter-input">
  <mat-icon aria-hidden="true" matPrefix>search</mat-icon>
  <input
    #searchInput
    (input)="valueChange.emit(searchInput.value)"
    [attr.aria-label]="placeholder"
    [placeholder]="placeholder"
    autocomplete="off"
    matInput
  />
  @if (searchInput.value) {
    <button
      (click)="onClear(searchInput)"
      [attr.aria-label]="clearLabel"
      mat-icon-button
      matSuffix
      type="button"
    >
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  }
</mat-form-field>
