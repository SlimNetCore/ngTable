<mat-form-field appearance="outline" class="select-filter-input">
  <ng-table-icon aria-hidden="true" matPrefix name="search"/>
  <input
    #searchInput
    (input)="valueChange.emit(searchInput.value)"
    [attr.aria-label]="placeholder"
    [placeholder]="placeholder"
    autocomplete="off"
    matInput
  />
  @if (searchInput.value) {
    <button
      (click)="onClear(searchInput)"
      [attr.aria-label]="clearLabel"
      ngt-icon-button
      matSuffix
      type="button"
    >
      <ng-table-icon aria-hidden="true" name="close"/>
    </button>
  }
</mat-form-field>
